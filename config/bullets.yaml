# ---------------------------------------------------------------------------
# bullets.yaml -- the bullet bank.
#
# Every bullet here is lifted verbatim from the canonical 2026 resume. The
# tailoring step SELECTS and ORDERS from this file. It never writes a new
# claim, never adds a skill, date, employer, or metric, and never rephrases a
# bullet into something stronger than the original.
#
# If a job wants something that isn't in here, the correct outcome is a weaker
# match -- not a new bullet.
#
# strength: 1-5, how well the bullet stands on its own regardless of posting.
# tags: used for overlap scoring against the job description.
# ---------------------------------------------------------------------------

summary_base: >-
  Data and analytics professional with a B.S. in Computer Science and an M.Eng.
  from Oregon State University. Builds automated ETL pipelines in Python and SQL
  and replaces manual reporting with tools teams can run themselves. Experience
  across the full data lifecycle - ingestion, transformation, quality
  validation, and BI reporting - plus hands-on evaluation of AI model outputs at
  scale.

bullets:
