    text: "Built a scheduled ETL pipeline that ingests job postings from nine public job-board and ATS REST APIs, normalizes them into a single schema, and deduplicates on insert."
    tags: [etl, python, postgres, rest_api, orchestration, data_pipeline]
    strength: 5

  - id: tracking_engine_deploy
    employer: "Project: Automated Job Market Data Pipeline"
