# ---------------------------------------------------------------------------
# companies.yaml -- employers polled every night, one row per ATS board.
#
# RULE: nothing lands here unvalidated. A wrong slug fails in two ways, and the
# second is worse than the first. It can return an empty board, which looks
# exactly like a company with no openings and sits here contributing nothing.
# Or it can land on a DIFFERENT company's board that returns real postings,
# which files someone else's jobs under this employer's name. Confirm both that
# the board answers and that it belongs to the right company:
#
#     python -m tracking_engine.find_slug "Blue Shield of California"
#     python -m tracking_engine.find_slug --slug blueshieldca
#
# find_slug checks ownership against the board's own reported name and reports
# MISMATCH rather than CONFIRMED when they disagree. The first sweep that built
# this file produced five such mismatches out of 158 -- including `lever/blue`
# for Blue Shield of California, which is really BlueCloud Services, Inc.
#
# tier: 1 = poll first / highest interest, 2 = normal, 3 = long tail.
# The `companies` table is the runtime source of truth; this file seeds it.
#
# ---------------------------------------------------------------------------
# KNOWN GAP -- the Sacramento anchors are not here, and it is not an oversight.
#
# Kaiser Permanente, Sutter Health, Dignity Health, UC Davis Health, Blue Shield
# of California, VSP, Delta Dental, SMUD, Sacramento County and the City all run
# Workday or a bespoke portal. Neither exposes a keyless public JSON board, so
# none of the five supported ATSes can reach them. They were all probed and none
# confirmed.
#
# That means the local-address advantage this pipeline was partly built around
# is NOT currently served by it. Those employers stay a manual channel alongside
# CalCareers, and the weekly readout carries a standing reminder for both.
# ---------------------------------------------------------------------------

