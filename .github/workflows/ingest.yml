name: phase-1a-ingest

# Phase 1a. 01:00 America/Los_Angeles, deliberately early.
#
# The plan was for phase 1b to dispatch this directly at 06:30 PT rather than
# trust the scheduler, because Actions crons have run up to 9.5 hours late here
# (scheduled 11:30 UTC, observed 21:04 UTC on 2026-08-27). That turned out not
# to be possible: 1b runs in a sandbox with no authenticated `gh`, so it cannot
# dispatch anything.
#
# So the schedule absorbs the lateness instead. Firing at 01:00 PT leaves five
# and a half hours of slack before 1b needs the data at 06:30, which covers the
# worst delay actually observed. If a run lands after 1b, the backlog carries
# that morning and the postings get scored the next day.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  # Tests run on every push; the ingest job below is gated so a push never
  # triggers a real run against the database.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: tracking-engine-ingest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
