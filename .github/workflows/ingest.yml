name: phase-1a-ingest

# DETACHED 2026-09-04. Job tracking was removed from Tracking Engine: the seven
# tables this writes to were dropped from the database, so a real run now fails
# on its first upsert.
#
# The `schedule:` trigger is deliberately gone -- that is what actually stops it
# firing, and it is the one line to restore if the job hunt resumes. The ingest
# job below is additionally gated off so that a stray `workflow_dispatch` cannot
# run it against a schema that is not there.
#
# The test job still runs on every push. The filter tests are pure functions and
# touch no database, so they stay green and keep the code honest.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Detached: never runs. Restore the condition below alongside `schedule:`.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: tracking-engine-ingest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
